description: |-
  Воплощенный реликт древнейшей эпохи, Бог Океана что уже тысячи лет неустанно держит в руках один из Великих Аспектов и главенство Дома Пелагос. 
  Он - сам Океан во плоти. Суров и не терпит слабости, особенно среди своих потомков.
