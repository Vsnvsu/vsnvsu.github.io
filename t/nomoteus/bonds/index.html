<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Дары</title>
    <meta name="description" content="Список даров в виде простой памятки.">
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Russo+One&display=swap');

        :root {
            --page: #ece6e2;
            --paper: #f6f2ef;
            --text: #1c1c1c;
            --muted: #343434;
            --stroke: #d3cbc4;
            --title-bg: #111111;
            --title-fg: #f4f4f4;
            --shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--text);
            font-family: "Montserrat", Helvetica, sans-serif;
        }

        .page {
            width: min(100%, 1100px);
            margin: 0 auto;
            padding: 24px 18px 32px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 14px;
            margin: 0 0 18px;
            padding: 10px 12px;
            background: rgba(246, 242, 239, 0.88);
            border: 1px solid var(--stroke);
            box-shadow: var(--shadow);
        }

        .filters-title {
            margin: 0;
            font-size: 0.92rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #49433e;
            font-weight: 700;
        }

        .filter-option {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.1;
            cursor: pointer;
            user-select: none;
        }

        .filter-option input {
            margin: 0;
            accent-color: #111111;
        }

        .grid {
            column-width: 360px;
            column-gap: 26px;
        }

        .card {
            display: inline-block;
            width: 100%;
            background: var(--paper);
            border: 1px solid var(--stroke);
            box-shadow: var(--shadow);
            padding: 10px 10px 12px;
            margin: 0 0 14px;
            break-inside: avoid;
            -webkit-column-break-inside: avoid;
            page-break-inside: avoid;
        }

        .card h2 {
            display: inline-block;
            margin: 0 0 8px;
            padding: 8px 10px 6px;
            background: var(--title-bg);
            color: var(--title-fg);
            font-size: 1.18rem;
            line-height: 1.05;
            font-weight: 700;
            width: calc(100% + 20px);
            margin-left: -10px;
            margin-bottom: -0px;
            position: relative;
            top: -10px;
            text-transform: uppercase;
            font-family: "Russo One", sans-serif;
            font-weight: 100;
        }

        .card p {
            margin: 0;
            color: var(--muted);
            font-size: 1.02rem;
            line-height: 1.28;
            letter-spacing: 0.01em;
        }

        .rich-block {
            color: var(--muted);
            font-size: 1.02rem;
            line-height: 1.28;
            letter-spacing: 0.01em;
        }

        .rich-block ul,
        .rich-block ol {
            margin: 0;
            padding-left: 1.2rem;
        }

        .rich-block li + li {
            margin-top: 4px;
        }

        .kind {
            margin: 0 0 8px;
            color: #5c5c5c;
            font-size: 0.96rem;
            font-style: italic;
            line-height: 1.1;
            font-weight: 500;
        }

        .card p + p {
            margin-top: 10px;
        }

        .card p + .rich-block,
        .card .rich-block + p,
        .card .rich-block + .rich-block {
            margin-top: 10px;
        }

        .status {
            margin: 0;
            color: #5c5c5c;
            font-size: 1rem;
            line-height: 1.3;
        }

        @media (max-width: 760px) {
            .page {
                padding: 18px 14px 24px;
            }

            .grid {
                column-width: auto;
                column-count: 1;
                column-gap: 0;
            }

            .card h2 {
                font-size: 1rem;
            }

            .card p {
                font-size: 0.98rem;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="filters" id="source-filters" hidden>
            <p class="filters-title">Показать</p>
        </section>
        <section class="grid" id="bonds-list">
            <p class="status">Загрузка даров...</p>
        </section>
    </main>
    <script>
        const bondsList = document.getElementById("bonds-list");
        const sourceFilters = document.getElementById("source-filters");
        const bondsUrl = location.protocol === "file:"
            ? "https://vsnvsu.github.io/t/nomoteus/bonds/bonds.json"
            : "bonds.json";
        let allBonds = [];

        function renderBondCard(bond) {
            const card = document.createElement("article");
            card.className = "card";

            const title = document.createElement("h2");
            title.textContent = bond.title;
            card.appendChild(title);

            const kind = document.createElement("p");
            kind.className = "kind";
            kind.textContent = bond.kind;
            //card.appendChild(kind);

            for (const paragraphText of bond.description) {
                const text = paragraphText.trim();

                if (/^<(ul|ol)>/i.test(text)) {
                    const block = document.createElement("div");
                    block.className = "rich-block";
                    block.innerHTML = text;
                    card.appendChild(block);
                    continue;
                }

                const paragraph = document.createElement("p");
                paragraph.innerHTML = text;
                card.appendChild(paragraph);
            }

            return card;
        }

        function getEnabledGroups() {
            return Array.from(
                sourceFilters.querySelectorAll('input[type="checkbox"]:checked')
            ).map((input) => input.value);
        }

        function renderBonds() {
            const enabledGroups = new Set(getEnabledGroups());
            const visibleBonds = allBonds.filter((bond) => {
                if (bond.source === "original") {
                    return enabledGroups.has("old");
                }

                return enabledGroups.has("new");
            });

            if (!visibleBonds.length) {
                const status = document.createElement("p");
                status.className = "status";
                status.textContent = "Нет даров для выбранных источников.";
                bondsList.replaceChildren(status);
                return;
            }

            bondsList.replaceChildren(...visibleBonds.map(renderBondCard));
        }

        function setupSourceFilters(bonds) {
            const counts = bonds.reduce((acc, bond) => {
                acc[bond.source] = (acc[bond.source] || 0) + 1;
                return acc;
            }, {});

            const oldCount = counts.original || 0;
            const newCount = Object.entries(counts).reduce((sum, [source, count]) => {
                return source === "original" ? sum : sum + count;
            }, 0);

            const groups = [
                { value: "old", label: `Старые (${oldCount})` },
                { value: "new", label: `Новые (${newCount})` },
            ];

            const controls = groups.map((group) => {
                const label = document.createElement("label");
                label.className = "filter-option";

                const input = document.createElement("input");
                input.type = "checkbox";
                input.value = group.value;
                input.checked = true;
                input.addEventListener("change", renderBonds);

                const text = document.createElement("span");
                text.textContent = group.label;

                label.append(input, text);
                return label;
            });

            sourceFilters.replaceChildren(sourceFilters.firstElementChild, ...controls);
            sourceFilters.hidden = false;
        }

        async function loadBonds() {
            try {
                const response = await fetch(bondsUrl, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error("Failed to load bonds.json");
                }

                allBonds = await response.json();
                setupSourceFilters(allBonds);
                renderBonds();
            } catch (error) {
                const status = document.createElement("p");
                status.className = "status";
                status.textContent = location.protocol === "file:"
                    ? "Не удалось загрузить список даров. Откройте страницу через локальный сервер или дождитесь публикации на GitHub Pages."
                    : "Не удалось загрузить список даров.";
                bondsList.replaceChildren(status);
                sourceFilters.hidden = true;
            }
        }

        loadBonds();
    </script>
</body>
</html>
